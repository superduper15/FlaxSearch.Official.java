name: Scheduled Web Crawler

on:
  schedule:
    - cron: '0 0 * * *' # Runs automatically once every day at midnight UTC
  workflow_dispatch: # Allows you to manually trigger it from your phone/GitHub UI

jobs:
  run-crawler:
    runs-weight: write
    permissions:
      contents: write # Allows the workflow to push the index file back to your repo
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Run Indexer for 5 Minutes
      run: |
        # Start the Java program in crawl-only mode, bypassing the interactive server
        # Timeout forces it to stop after 5 minutes so GitHub doesn't run infinitely
        timeout 300s java -Dcrawl=true -Dseeds=seeds.txt -Ddata=flax-data FlaxSearch.java || true

    - name: Commit and Push Updated Search Index
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        git add flax-data/index.dat
        git diff-index --quiet HEAD || git commit -m "Automated crawl: Updated search index data"
        git push
